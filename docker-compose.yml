services:
  api:
    build: .
    container_name: agrivision_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # CHANGED: Map local directory to /app (matches Dockerfile WORKDIR)
      - .:/app
    depends_on:
      - db 
    networks:
      - agrivision_net

  db:
    image: postgres:15-alpine
    container_name: agrivision_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agrivision_net

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    volumes:
      - minio_data:/data
    networks:
      - agrivision_net
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  minio_data:

  
networks:
  agrivision_net:
    driver: bridge
