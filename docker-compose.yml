version: '3.8'

services:
  api:
    build: .
    container_name: agrivision_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # CHANGED: Map local directory to /app (matches Dockerfile WORKDIR)
      - .:/app
    networks:
      - agrivision_net

networks:
  agrivision_net:
    driver: bridge